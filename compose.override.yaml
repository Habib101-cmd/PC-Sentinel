services:
  api:
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules